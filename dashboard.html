<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKI E&S RCA Agent Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #f4f7f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #334155; }
        .main-header { border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px; }
        
        /* 메인 패널 스타일 */
        .panel { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 24px; min-height: 780px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .side-panel { min-height: auto; margin-bottom: 20px; }

        /* 분석 단계 박스 */
        .step-box { padding: 12px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; text-align: center; display: none; transition: all 0.3s ease; }
        .step-loading { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .step-success { background-color: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        
        @keyframes hourglass-flip {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(180deg); }
        }
        .spinning-hourglass { display: inline-block; animation: hourglass-flip 1.2s infinite ease-in-out; }

        /* 리포트 레이아웃 전용 (내부 소스 패널 포함) */
        .report-container { position: relative; width: 100%; margin-top: 20px; }
        
        /* [🔥 신규] 리포트 내 우측 상단 미니 소스 보드 */
        #knowledge-source-board {
            float: right;
            width: 280px;
            margin-left: 20px;
            margin-bottom: 20px;
            padding: 16px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: none; /* 초기 숨김 */
        }
        .source-section-title { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; align-items: center; }
        
        /* 미니 버튼 스타일 */
        .btn-mini-source {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            color: #475569;
            text-decoration: none;
            font-size: 0.75rem;
            margin-bottom: 6px;
            transition: all 0.2s;
        }
        .btn-mini-source:hover { background: #f1f5f9; color: #1e293b; border-color: #cbd5e1; transform: translateX(2px); }
        .btn-mini-source i { font-size: 0.7rem; }

        /* 리포트 본문 텍스트 */
        #report-output { line-height: 1.8; font-size: 1rem; color: #1e293b; }
        #report-output h2 { font-size: 1.5rem; border-left: 4px solid #3b82f6; padding-left: 12px; margin: 30px 0 15px; font-weight: 700; }
        #report-output a[href^="http"] {
            display: inline-block;
            background-color: #f0fdf4;
            color: #166534;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
            text-decoration: none;
            border: 1px solid #bbf7d0;
            margin: 0 2px;
        }

        .debug-console { background: #1e293b; color: #4ade80; font-family: monospace; font-size: 0.75rem; padding: 10px; border-radius: 6px; margin-top: 20px; max-height: 150px; overflow-y: auto; display: none; }
    </style>
</head>
<body>

<div class="container-fluid p-4">
    <div class="main-header row align-items-center">
        <div class="col-md-8">
            <h2 class="fw-bold"><i class="fa-solid fa-microchip text-primary me-2"></i> SKI E&S RCA Agent Intelligence</h2>
        </div>
        <div class="col-md-4 text-md-end">
            <span class="badge bg-white text-dark border p-2 font-monospace" style="font-size: 0.8rem;">
                🕒 System Sync: 2026-06-25 17:35
            </span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4 col-md-5">
            <div class="panel side-panel">
                <h5 class="fw-bold mb-4 text-primary"><i class="fa-solid fa-satellite-dish me-2"></i>Telemetry Input</h5>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">대상 설비 ID (Asset)</label>
                    <select id="asset_id" class="form-select">
                        <option value="BFP-01A">보일러 급수 펌프 (BFP-01A)</option>
                        <option value="GT-01">가스 터빈 (GT-01)</option>
                        <option value="COMP-02B">원심 압축기 (COMP-02B)</option>
                        <option value="RO-02">역삼투압 시스템 (RO-02)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">유입 알람명 (Alarm)</label>
                    <select id="alarm_name" class="form-select">
                        <option value="AL_VIB_HIGH (급수펌프 베어링 진동 고)">급수펌프 베어링 진동 고 (AL_VIB_HIGH)</option>
                        <option value="AL_SURGE_WARN (압축기 서지 전조 알람)">압축기 서지 전조 알람 (AL_SURGE_WARN)</option>
                        <option value="AL_RO_DP_HIGH (RO 막 전후단 차압 고)">RO 막 전후단 차압 고 (AL_RO_DP_HIGH)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">측정 수치 (Value): <span id="slider-val" class="text-primary">12.8</span></label>
                    <input type="range" class="form-range" id="telemetry_value" min="0" max="20" step="0.1" value="12.8" oninput="document.getElementById('slider-val').innerText=this.value">
                </div>

                <button id="btn-submit" class="btn btn-primary w-100 py-2 fw-bold border-0" style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);">
                    <i class="fa-solid fa-bolt me-2"></i>실시간 RCA 분석 실행
                </button>
            </div>
            
            <div id="debug-monitor" class="debug-console"></div>
        </div>

        <div class="col-lg-8 col-md-7">
            <div class="panel">
                <div class="row g-2 mb-4">
                    <div class="col-4"><div id="step1" class="step-box"></div></div>
                    <div class="col-4"><div id="step2" class="step-box"></div></div>
                    <div class="col-4"><div id="step3" class="step-box"></div></div>
                </div>

                <div id="progress-area" class="text-center py-5 d-none">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <p class="text-muted">전사 정비 지식 및 과거 RCA 리포트 조각들을 매칭하여 원인을 추론 중입니다...</p>
                </div>

                <div class="report-container">
                    <div id="knowledge-source-board">
                        <div class="source-section-title"><i class="fa-solid fa-share-nodes me-2 text-success"></i>Ontology (Neo4j)</div>
                        <div id="neo4j-list-area" class="mb-3"></div>
                        
                        <div class="source-section-title"><i class="fa-solid fa-database me-2 text-danger"></i>Evidence (Pinecone)</div>
                        <div id="pinecone-list-area"></div>
                    </div>

                    <div id="report-output">
                        <div class="text-center text-muted py-5">
                            <i class="fa-solid fa-file-invoice-arrow-right fa-3x mb-3 opacity-25"></i>
                            <p>좌측 설비 데이터를 입력하고 분석 버튼을 누르면<br>엔지니어링 RCA 리포트가 이곳에 생성됩니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('btn-submit').addEventListener('click', async function() {
    const assetId = document.getElementById('asset_id').value;
    const alarmNameRaw = document.getElementById('alarm_name').value;
    const telemetryValue = parseFloat(document.getElementById('telemetry_value').value);
    
    const n8nUrl = "https://seoneenam.app.n8n.cloud/webhook/early-warning-alarm";
    const pureAlarmId = alarmNameRaw.split(' ')[0]; 

    const s1 = document.getElementById('step1');
    const s2 = document.getElementById('step2');
    const s3 = document.getElementById('step3');
    const progress = document.getElementById('progress-area');
    const output = document.getElementById('report-output');
    const sourceBoard = document.getElementById('knowledge-source-board');
    const neo4jArea = document.getElementById('neo4j-list-area');
    const pineconeArea = document.getElementById('pinecone-list-area');

    // UI 초기화
    output.innerHTML = "";
    sourceBoard.style.display = "none";
    neo4jArea.innerHTML = "";
    pineconeArea.innerHTML = "";
    
    const loader = `<span class="spinning-hourglass me-2">⏳</span>`;

    s1.className = "step-box step-loading"; s1.style.display = "block"; s1.innerHTML = `${loader}Ontology Mapping`;
    s2.style.display = "none"; s3.style.display = "none";
    progress.classList.remove('d-none');

    const apiPromise = fetch(n8nUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ asset_id: assetId, alarm_name: alarmNameRaw, alarm_id: pureAlarmId, value: telemetryValue, timestamp: new Date().toISOString() })
    });

    // 가짜 진행 애니메이션
    let timer = 0;
    const interval = setInterval(() => {
        timer += 0.5;
        if (timer === 3) {
            s1.className = "step-box step-success"; s1.innerHTML = "✔ Ontology Linked";
            s2.className = "step-box step-loading"; s2.style.display = "block"; s2.innerHTML = `${loader}Evidence Retrieval`;
        }
        if (timer === 6) {
            s2.className = "step-box step-success"; s2.innerHTML = "✔ Evidence Found";
            s3.className = "step-box step-loading"; s3.style.display = "block"; s3.innerHTML = `${loader}Generating Report`;
        }
    }, 500);

    try {
        const response = await apiPromise;
        clearInterval(interval);
        progress.classList.add('d-none');

        if (response.ok) {
            s3.className = "step-box step-success"; s3.innerHTML = "✔ Report Finalized";
            const rawData = await response.json();
            const resJson = Array.isArray(rawData) ? rawData[0] : rawData;

            // 1. 리포트 본문 렌더링
            let reportMarkdown = resJson.output || "분석 결과가 없습니다.";
            output.innerHTML = marked.parse(reportMarkdown);

            // 2. 소스 보드 활성화 및 데이터 매핑
            sourceBoard.style.display = "block";

            // Neo4j 매핑
            let neo4jDocs = resJson.neo4jDocuments || resJson.neo4j_documents || [];
            while (typeof neo4jDocs === 'string') {
                if (neo4jDocs.trim() === "" || neo4jDocs.trim() === "[]") { neo4jDocs = []; break; }
                neo4jDocs = JSON.parse(neo4jDocs);
            }
            if (Array.isArray(neo4jDocs) && neo4jDocs.length > 0) {
                neo4jDocs.forEach(doc => {
                    if (!doc.url || doc.url === "#") return;
                    const a = document.createElement('a');
                    a.className = "btn-mini-source";
                    a.href = doc.url; a.target = "_blank";
                    a.innerHTML = `<span><i class="fa-solid fa-file-pdf text-danger me-2"></i>${doc.title}</span><i class="fa-solid fa-arrow-up-right-from-square opacity-50"></i>`;
                    neo4jArea.appendChild(a);
                });
            } else { neo4jArea.innerHTML = "<div class='text-muted' style='font-size:0.7rem;'>No ontology matched.</div>"; }

            // Pinecone 매핑
            let pineconeDocs = resJson.pineconeDocuments || [];
            if (typeof pineconeDocs === 'string') pineconeDocs = JSON.parse(pineconeDocs);
            if (Array.isArray(pineconeDocs) && pineconeDocs.length > 0) {
                pineconeDocs.forEach(doc => {
                    if (doc.references) {
                        doc.references.forEach(ref => {
                            const file = ref.file;
                            if (file && file.signed_url) {
                                const a = document.createElement('a');
                                a.className = "btn-mini-source";
                                a.href = file.signed_url; a.target = "_blank";
                                a.innerHTML = `<span><i class="fa-solid fa-file-lines text-primary me-2"></i>${file.name}</span><i class="fa-solid fa-link opacity-50"></i>`;
                                pineconeArea.appendChild(a);
                            }
                        });
                    }
                });
            } else { pineconeArea.innerHTML = "<div class='text-muted' style='font-size:0.7rem;'>No documents found.</div>"; }

        }
    } catch (error) {
        clearInterval(interval);
        output.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
    }
});
</script>
</body>
</html>
