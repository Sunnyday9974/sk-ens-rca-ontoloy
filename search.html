<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SK Group AI/DT - RCA 지식 그래프 탐색기 [v2026.06.17.1045]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        :root {
            --primary: #1e293b; --secondary: #f8fafc; --accent: #e02020; --text: #334155; --border: #e2e8f0;
            --node-doc: #FFDC00; --node-asset: #2ECC40; --node-alarm: #FF851B; --node-fm: #FF4136;
        }
        body { background-color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text); }
        
        /* 슬라이드 컨테이너 설정 */
        .slide-container {
            width: 1280px; height: 720px; background-color: var(--secondary); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        /* 헤더 섹션 (index.html 스타일) */
        header { padding: 40px 60px 20px 60px; background: linear-gradient(to right, #ffffff, #f1f5f9); }
        .slide-title { font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 700; color: var(--primary); margin: 0; display: flex; align-items: center; gap: 15px; }
        .slide-title i { color: var(--accent); }
        .subtitle { font-size: 16px; color: #64748b; margin-top: 5px; }

        /* 검색 바 (컨트롤 패널) */
        .search-panel { 
            display: flex; gap: 12px; padding: 0 60px 25px 60px; background: white; border-bottom: 1px solid var(--border);
            flex-wrap: wrap; align-items: flex-end;
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        select { 
            padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background-color: #fff; font-size: 13px; 
            min-width: 180px; transition: all 0.2s; outline: none; cursor: pointer;
        }
        select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224, 32, 32, 0.1); }
        .btn-search { 
            background-color: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; 
            font-weight: 700; font-size: 13px; cursor: pointer; transition: background 0.2s; height: 40px; margin-left: 10px;
        }
        .btn-search:hover { background-color: #b01818; }

        /* 메인 콘텐츠 영역 */
        .main-content { display: flex; flex: 1; padding: 25px 60px; gap: 25px; overflow: hidden; }
        #cy { flex: 2.5; background: white; border-radius: 12px; border: 1px solid var(--border); position: relative; }
        
        /* 사이드바 스타일링 */
        .sidebar { 
            flex: 1; background: white; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-header { padding: 20px; background-color: #f1f5f9; border-bottom: 1px solid var(--border); font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 15px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .sidebar-content { padding: 20px; flex: 1; overflow-y: auto; font-size: 14px; }
        .detail-card { background-color: #f8fafc; border-radius: 8px; padding: 15px; border-left: 4px solid var(--accent); margin-top: 10px; }
        .info-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; }

        /* 노드 색상 태그 */
        .tag-doc { background: #fff9db; color: #856404; }
        .tag-asset { background: #d4edda; color: #155724; }
        .tag-alarm { background: #fff3e0; color: #e65100; }
        .tag-fm { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="slide-container">
    <header>
        <h1 class="slide-title"><i class="fa-solid fa-circle-nodes"></i> RCA Knowledge Graph Analytics</h1>
        <div class="subtitle">다차원 교차 조건(AND) 분석을 통한 장애 인과관계 추적 시스템</div>
    </header>

    <div class="search-panel">
        <div class="control-group">
            <label>Document</label>
            <select id="docSelect"><option value="">-- 전체 --</option></select>
        </div>
        <div class="control-group">
            <label>Asset</label>
            <select id="assetSelect"><option value="">-- 전체 --</option></select>
        </div>
        <div class="control-group">
            <label>Alarm</label>
            <select id="alarmSelect"><option value="">-- 전체 --</option></select>
        </div>
        <div class="control-group">
            <label>Failure Mode</label>
            <select id="failureModeSelect"><option value="">-- 전체 --</option></select>
        </div>
        <button class="btn-search" onclick="searchNetworkAND()">지식 그래프 조회</button>
    </div>

    <div class="main-content">
        <div id="cy"></div>
        <div class="sidebar">
            <div class="sidebar-header"><i class="fa-solid fa-magnifying-glass-chart"></i> 상세 정보 상세보기</div>
            <div class="sidebar-content" id="detailContent">
                <p style="color:#94a3b8; text-align:center; margin-top:100px;">노드나 연결선을 클릭하면<br>데이터베이스의 상세 본문이 표시됩니다.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const N8N_PRODUCTION_URL = 'https://seoneenam.app.n8n.cloud/webhook'; 
    let cy;

    // 1. 초기 로딩 시 데이터 바인딩
    window.onload = async function() {
        try {
            const response = await fetch(`${N8N_PRODUCTION_URL}/master-codes`);
            const jsonResult = await response.json();
            let rawData = jsonResult[0]?.data || jsonResult[0]?.body?.data || jsonResult.data;
            const values = rawData.values[0];
            
            bindDropdown('docSelect', values[0] || []);
            bindDropdown('assetSelect', values[1] || []);
            bindDropdown('alarmSelect', values[2] || []);
            bindDropdown('failureModeSelect', values[3] || []);
        } catch (error) { console.error('목록 로드 실패:', error); }
    };

    function bindDropdown(elementId, dataList) {
        const select = document.getElementById(elementId);
        dataList.forEach(id => { if(id) { let opt = document.createElement('option'); opt.value = id; opt.innerText = id; select.appendChild(opt); } });
    }

    // 2. 검색 및 시각화
    async function searchNetworkAND() {
        const docId = document.getElementById('docSelect').value;
        const assetId = document.getElementById('assetSelect').value;
        const alarmId = document.getElementById('alarmSelect').value;
        const fmId = document.getElementById('failureModeSelect').value;
        
        if (!docId && !assetId && !alarmId && !fmId) { alert('검색 조건을 선택해 주세요.'); return; }

        try {
            const response = await fetch(`${N8N_PRODUCTION_URL}/search-network?docId=${docId}&assetId=${assetId}&alarmId=${alarmId}&fmId=${fmId}`);
            const jsonResult = await response.json();
            let rows = jsonResult[0]?.data?.values || jsonResult[0]?.body?.data?.values || jsonResult.data?.values;

            if (!rows || rows.length === 0) { alert('일치하는 인과관계 선로가 없습니다.'); if(cy) cy.destroy(); return; }

            const elements = [];
            const addedNodeIds = new Set();

            rows.forEach(row => {
                const target = row[0]; const relationship = row[1]; const neighbor = row[2];
                [target, neighbor].forEach(n => {
                    if (n?.properties && !addedNodeIds.has(n.properties.id)) {
                        elements.push({ data: { id: n.properties.id, label: n.labels[0] || 'Unknown', name: n.properties.name } });
                        addedNodeIds.add(n.properties.id);
                    }
                });
                if (relationship) {
                    elements.push({ data: { id: relationship.elementId, source: relationship.startNodeElementId === target.elementId ? target.properties.id : neighbor.properties.id, target: relationship.endNodeElementId === target.elementId ? target.properties.id : neighbor.properties.id, type: relationship.type } });
                }
            });
            initCytoscape(elements);
        } catch (error) { console.error('조회 실패:', error); }
    }

    // 3. Cytoscape 전문 시각화 세팅
    function initCytoscape(elements) {
        cy = cytoscape({
            container: document.getElementById('cy'),
            elements: elements,
            style: [
                { selector: 'node', style: { 'background-color': '#94a3b8', 'label': 'data(id)', 'color': '#334155', 'font-size': '9px', 'font-family': 'Inter', 'text-valign': 'bottom', 'text-margin-y': '6px', 'width': '20px', 'height': '20px' } },
                { selector: 'node[label="Document"]', style: { 'background-color': '#FFDC00', 'width': '30px', 'height': '30px' } },
                { selector: 'node[label="Asset"]', style: { 'background-color': '#2ECC40', 'width': '30px', 'height': '30px' } },
                { selector: 'node[label="Alarm"]', style: { 'background-color': '#FF851B', 'width': '30px', 'height': '30px' } },
                { selector: 'node[label="FailureMode"]', style: { 'background-color': '#FF4136', 'width': '35px', 'height': '35px', 'border-width': '3px', 'border-color': '#ffebee' } },
                { selector: 'edge', style: { 'width': 1.5, 'line-color': '#cbd5e1', 'target-arrow-color': '#cbd5e1', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'label': 'data(type)', 'font-size': '8px', 'color': '#94a3b8', 'text-rotation': 'autorotate' } }
            ],
            layout: { name: 'cose', animate: true, nodeRepulsion: 4000, idealEdgeLength: 100 }
        });

        cy.on('tap', 'node', function(evt){
            const node = evt.target;
            const label = node.data('label');
            const tagClass = 'tag-' + label.toLowerCase().replace('mode', '');
            document.getElementById('detailContent').innerHTML = `
                <span class="info-tag ${tagClass}">${label}</span>
                <div class="info-item" style="font-size:16px; font-weight:700; color:var(--primary);">${node.data('id')}</div>
                <div class="detail-card">
                    <div style="font-weight:600; margin-bottom:5px; color:#64748b; font-size:12px;">DESCRIPTION / CONTENT</div>
                    ${node.data('name') || '내용 정보가 없습니다.'}
                </div>
            `;
        });
    }
</script>
</body>
</html>
