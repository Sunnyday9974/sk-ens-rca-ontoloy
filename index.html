<script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <script>
        // ================= [필수 설정 항목] =================
        const API_KEY = 'AIzaSyDUb9w8DUJ1z6rA3f1cWLvtK_dHML2B0Ys';
        const CLIENT_ID = '226564701904-hr1l78rknenlm0fn3gul1cvmkve0ntuc.apps.googleusercontent.com';
        // ===================================================

        // 구글 드라이브 파일 조회를 위한 표준 권한 스코프
        const SCOPE = 'https://www.googleapis.com/auth/drive.readonly';

        let accessToken = null;
        let selectedFileId = null;
        let selectedFileName = null;
        let tokenClient = null;

        const btnSelectFile = document.getElementById('btn-select-file');
        const btnStartTransform = document.getElementById('btn-start-transform');
        const fileInfo = document.getElementById('file-info');
        const processSection = document.getElementById('process-section');
        const resultSection = document.getElementById('result-section');

        // 1. 페이지 로드 시 구글 API 인프라 빌드 및 토큰 클라이언트 초기화
        function initGapi() {
            // 구글 Picker API 로드
            gapi.load('picker', () => { console.log('GAPI picker loaded'); });
            
            // COOP 보안 충돌을 방지하기 위한 최신 Identity 서비스 토큰 클라이언트 초기화
            if (typeof google !== 'undefined') {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPE,
                    callback: (response) => {
                        if (response.error !== undefined) {
                            console.error('인증 오류:', response.error);
                            alert('인증 오류가 발생했습니다.');
                            return;
                        }
                        accessToken = response.access_token;
                        console.log('토큰 획득 성공!');
                        // 토큰 획득 후 즉시 안전하게 Picker 호출
                        createPicker();
                    },
                });
                console.log('Google Token Client 초기화 완료');
            }
        }

        window.onload = () => {
            // 라이브러리가 완전히 로드될 시간을 주며 안전하게 초기화 실행
            setTimeout(initGapi, 1000);
        };

        // 2. 파일 선택 버튼 클릭 이벤트
        btnSelectFile.addEventListener('click', () => {
            if (!tokenClient) {
                alert('구글 라이브러리를 초기화 중입니다. 잠시 후 다시 시도해 주세요.');
                initGapi();
                return;
            }

            // 만약 기존에 얻은 토큰이 있다면 바로 Picker를 열고, 없다면 로그인 요청
            if (accessToken === null) {
                // 이 함수가 실행되면서 구글 로그인 창이 팝업됩니다.
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                createPicker();
            }
        });

        // 3. 실제 구글 드라이브 Picker 팝업 창 생성
        function createPicker() {
            if (!accessToken) return;
            
            try {
                // 사용자의 구글 드라이브 파일들을 보여주는 기본 뷰 생성
                const view = new gapi.picker.View(gapi.picker.ViewId.DOCS);
                
                const picker = new gapi.picker.PickerBuilder()
                    .addView(view)
                    .setOAuthToken(accessToken)
                    .setDeveloperKey(API_KEY)
                    .setCallback(pickerCallback)
                    .setTitle("나래 O&M RCA 리포트 선택")
                    .build();
                
                picker.setVisible(true);
                console.log('Picker 팝업 창이 정상적으로 표시되었습니다.');
            } catch (error) {
                console.error('Picker 생성 실패:', error);
            }
        }

        // 4. 파일이 정상적으로 선택되었을 때의 콜백
        function pickerCallback(data) {
            if (data[gapi.picker.Response.ACTION] == gapi.picker.Action.PICKED) {
                const doc = data[gapi.picker.Response.DOCUMENTS][0];
                selectedFileId = doc[gapi.picker.Document.ID];
                selectedFileName = doc[gapi.picker.Document.NAME];

                fileInfo.innerText = `📄 [선택됨] ${selectedFileName}`;
                fileInfo.classList.remove('text-gray-500', 'italic');
                fileInfo.classList.add('text-blue-600', 'font-medium');
                
                btnStartTransform.removeAttribute('disabled');
            }
        }

        // 5. 변환 시작 버튼 클릭 이벤트
        btnStartTransform.addEventListener('click', () => {
            if(!selectedFileId) return;
            processSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            simulateProcessing();
        });

        // (기존 시뮬레이션 제어 로직 유지)
        function simulateProcessing() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const step3 = document.getElementById('step-3');

            setStepStatus(step1, 'loading');
            setTimeout(() => {
                setStepStatus(step1, 'success');
                setStepStatus(step2, 'loading');
            }, 2000);
            setTimeout(() => {
                setStepStatus(step2, 'success');
                setStepStatus(step3, 'loading');
            }, 4000);
            setTimeout(() => {
                setStepStatus(step3, 'success');
                resultSection.classList.remove('hidden');
                document.getElementById('node-count').innerText = "14";
                document.getElementById('edge-count').innerText = "22";
            }, 6000);
        }

        function setStepStatus(stepElement, status) {
            const iconDiv = stepElement.querySelector('.step-icon');
            if(status === 'loading') {
                stepElement.className = "flex items-center gap-4 p-3 bg-blue-50 rounded border border-blue-200 animate-pulse";
                iconDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-blue-500"></i>';
            } else if(status === 'success') {
                stepElement.className = "flex items-center gap-4 p-3 bg-emerald-50 rounded border border-emerald-100";
                iconDiv.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
            }
        }
    </script>
