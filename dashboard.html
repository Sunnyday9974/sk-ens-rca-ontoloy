<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI/DT 설비 이상 경보 분석 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }
        .dashboard-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            border-bottom: 4px solid #f15a24;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #ffffff;
            border-bottom: 2px solid #e9ecef;
            font-weight: bold;
            color: #333;
        }
        #report-area {
            white-space: pre-line;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        /* 100% 동적 문서 연동 단추 스타일 가이드 */
        .btn-doc-vault {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            color: #495057;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            margin-bottom: 10px;
        }
        .btn-doc-vault:hover {
            background-color: #e9ecef;
            border-color: #adb5bd;
            color: #212529;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }
        .btn-doc-vault strong {
            color: #495057;
        }
        .loader {
            display: none;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <div class="dashboard-header rounded-3 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fa-solid fa-engine-warning me-2"></i> 전사적 AI Transformation 운영 인텔리전스</h2>
            <p class="mb-0 text-white-50">실시간 설비 이상 신호 감지 및 하이브리드 지식 그래프(RAG) 원인 추론 리포트</p>
        </div>
        <button id="btn-analyze" class="btn btn-warning btn-lg fw-bold text-dark">
            <i class="fa-solid fa-magnifying-glass-chart me-1"></i> 실시간 분석 실행
        </button>
    </div>

    <div id="loading-spinner" class="loader">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 text-muted fw-bold">Pinecone 지식베이스 및 Neo4j 온톨로지 정밀 원격 탐색 중...</p>
    </div>

    <div class="row" id="dashboard-content">
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center py-3">
                    <span class="fs-5"><i class="fa-solid fa-file-invoice text-primary me-2"></i> RCA 추론 분석 리포트 본문</span>
                    <span class="badge bg-success">AI 완결</span>
                </div>
                <div class="card-body p-4" id="report-area">
                    <div class="text-center text-muted py-5">
                        <i class="fa-solid fa-circle-info fa-3x mb-3 text-black-50"></i>
                        <p class="mb-0">상단의 '실시간 분석 실행' 버튼을 누르시면 정밀 진단이 시작됩니다.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card mb-4">
                <div class="card-header py-3">
                    <span class="fs-6"><i class="fa-solid fa-diagram-project text-success me-2"></i> Neo4j 고장 온톨로지 연동 자산</span>
                </div>
                <div class="card-body" id="neo4j-list-area">
                    <div class="text-muted small p-2 text-center">분석 실행 후 동적 로드됩니다.</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header py-3">
                    <span class="fs-6"><i class="fa-solid fa-database text-danger me-2"></i> Pinecone 지식 자산(Vector DB)</span>
                </div>
                <div class="card-body" id="pinecone-list-area">
                    <div class="text-muted small p-2 text-center">분석 실행 후 동적 로드됩니다.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById('btn-analyze').addEventListener('click', async () => {
    const spinner = document.getElementById('loading-spinner');
    const content = document.getElementById('dashboard-content');
    const reportArea = document.getElementById('report-area');
    const neo4jListArea = document.getElementById('neo4j-list-area');
    const pineconeListArea = document.getElementById('pinecone-list-area');

    // 1. UI 초기화 및 로딩 활성화
    spinner.style.display = 'block';
    content.style.opacity = '0.4';
    reportArea.innerHTML = '';
    neo4jListArea.innerHTML = '';
    pineconeListArea.innerHTML = '';

    // 테스트/프로덕션 환경에 부합하는 웹훅 URL 주소 세팅 (현재 배포 규격)
    const webhookUrl = 'https://prod-1-data.ke.n8n.cloud/webhook/early-warning-alarm';

    try {
        // 2. n8n 백엔드 엔진 호출
        const response = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                "asset_name": "Boiler Feedwater Pump (BFP-01A)",
                "failure_mode_name": "FM_CAVITATION (펌프 내부 캐비테이션 현상)"
            })
        });

        if (!response.ok) throw new Error('백엔드 파이프라인 응답 실패');
        const data = await response.json();

        // 3. AI Agent 마크다운 리포트 출력 바인딩
        if (data.output) {
            reportArea.innerHTML = data.output;
        } else {
            reportArea.innerHTML = `<div class="text-danger">원인 분석서 데이터가 존재하지 않습니다.</div>`;
        }

        // 4. [100% 동적] Neo4j 지식 자산 렌더링 엔진
        let neo4jDocs = data.neo4jDocuments || [];
        if (typeof neo4jDocs === 'string') {
            try { neo4jDocs = JSON.parse(neo4jDocs); } catch(e) { neo4jDocs = []; }
        }
        
        if (Array.isArray(neo4jDocs) && neo4jDocs.length > 0) {
            neo4jListArea.innerHTML = "";
            neo4jDocs.forEach(doc => {
                const anchorBtn = document.createElement('a');
                anchorBtn.className = "btn-doc-vault";
                anchorBtn.setAttribute('href', doc.url || "https://drive.google.com");
                anchorBtn.setAttribute('target', '_blank');
                anchorBtn.innerHTML = `
                    <span><i class="fa-solid fa-share-nodes text-success me-2"></i> <strong>[${doc.id || '연동'}]</strong> 과거 고장 사례 매칭</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-muted font-size-sm"></i>
                `;
                neo4jListArea.appendChild(anchorBtn);
            });
        } else {
            neo4jListArea.innerHTML = `<div class="text-muted small p-2">연동된 고장계통 온톨로지가 없습니다.</div>`;
        }

        // 5. [★최종 마감] Pinecone 지식 자산 렌더링 엔진 (하드코딩 0% 무결성 버전)
        let pineconeDocs = data.pineconeDocuments || [];
        if (typeof pineconeDocs === 'string') {
            try { pineconeDocs = JSON.parse(pineconeDocs); } catch(e) { pineconeDocs = []; }
        }

        if (Array.isArray(docArray = pineconeDocs) && docArray.length > 0) {
            pineconeListArea.innerHTML = "";
            docArray.forEach(doc => {
                // UI 정제: 타이틀 텍스트 내 중복 노출되는 코드명(ID)을 깨끗하게 정리합니다.
                let cleanTitle = doc.title;
                if (doc.id && cleanTitle.includes(doc.id)) {
                    cleanTitle = cleanTitle.replace(doc.id, "").replace(":", "").trim();
                }

                // 문서 종류별 다이렉트 아이콘 매핑 분기
                let iconHtml = '<i class="fa-solid fa-file-pdf text-danger me-2"></i>';
                if (doc.title.includes("📘") || doc.title.includes("지침서")) {
                    iconHtml = '<i class="fa-solid fa-book text-primary me-2"></i>';
                } else if (doc.title.includes("📕") || doc.title.includes("가이드")) {
                    iconHtml = '<i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>';
                }

                // 백엔드가 준 진짜 가변 데이터로 단추 동적 마운트
                const anchorBtn = document.createElement('a');
                anchorBtn.className = "btn-doc-vault";
                anchorBtn.setAttribute('href', doc.url || "https://drive.google.com");
                anchorBtn.setAttribute('target', '_blank');
                anchorBtn.innerHTML = `
                    <span>${iconHtml} <strong>[${doc.id || '참조'}]</strong> ${cleanTitle}</span>
                    <i class="fa-brands fa-google-drive text-muted font-size-sm"></i>
                `;
                pineconeListArea.appendChild(anchorBtn);
            });
        } else {
            pineconeListArea.innerHTML = `<div class="text-muted small p-2">유사 추천 지식 자산 매칭 완료</div>`;
        }

    } catch (error) {
        console.error('대시보드 런타임 에러 발생:', error);
        reportArea.innerHTML = `<div class="alert alert-danger mt-3">파이프라인 통신 에러: ${error.message}</div>`;
    } finally {
        // 6. 로딩 비활성화 및 화면 복원
        spinner.style.display = 'none';
        content.style.opacity = '1';
    }
});
</script>
</body>
</html>
